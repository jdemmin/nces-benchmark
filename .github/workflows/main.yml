name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nces-benchmark-v2
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  build-and-test:
    name: Build image and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify CLI help is dependency-free
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --help

      - name: Run test suite
        run: |
          mkdir -p Output test-results
          docker run --rm \
            --entrypoint conda \
            -e OMP_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            -v "${{ github.workspace }}/Output:/app/Output" \
            -v "${{ github.workspace }}/test-results:/app/test-results" \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            run --no-capture-output -n nces-benchmark \
            pytest tests -v --junitxml=/app/test-results/junit.xml

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: test-results/junit.xml
          check_name: pytest results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  smoke-test:
    name: Smoke-test benchmark run
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 60
    # Requires a knowledge base in datasets/; skip if only .gitkeep is present.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect available knowledge bases
        id: kbs
        run: |
          if compgen -G "datasets/*.owl" > /dev/null \
             || compgen -G "datasets/*/*.owl" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .owl file in datasets/; skipping smoke test."
          fi

      - name: Set up Docker Buildx
        if: steps.kbs.outputs.found == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Rebuild image from cache
        if: steps.kbs.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha

      - name: Run tiny benchmark
        if: steps.kbs.outputs.found == 'true'
        run: |
          mkdir -p Output
          docker run --rm \
            -e OMP_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            -v "${{ github.workspace }}/datasets:/app/datasets:ro" \
            -v "${{ github.workspace }}/input:/app/input:ro" \
            -v "${{ github.workspace }}/Output:/app/Output" \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --datasets father --seeds 1 \
            --num-problems 8 --dice-epochs 2 --nces-epochs 5 \
            --benchmark-name ci_smoke

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always() && steps.kbs.outputs.found == 'true'
        with:
          name: smoke-output
          path: Output/
          if-no-files-found: warn

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
