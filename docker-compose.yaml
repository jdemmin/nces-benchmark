# docker-compose.yml
services:
  benchmark:
    build: .
    image: nces-benchmark-v2:latest
    container_name: nces-benchmark-v2
    volumes:
      - ./datasets:/app/datasets:ro
      - ./input:/app/input:ro
      - ./Output:/app/Output
    # DICE + NCES are CPU-bound; cap threads to keep runs reproducible.
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command:
      - --benchmark-name
      - benchmark1
      - --datasets
      - father
