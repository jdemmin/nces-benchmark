# docker-compose.yml
services:
  benchmark:
    build: .
    image: nces-benchmark-v2:latest
    container_name: nces-benchmark-v2-linux
    volumes:
      - ./datasets:/app/datasets:ro
      - ./input:/app/input/smoke2:ro
      - ./output:/app/output/docker-compose-smoke
    # DICE + NCES are CPU-bound; cap threads to keep runs reproducible.
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
