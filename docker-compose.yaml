# docker-compose.yml
services:
  benchmark:
    shm_size: '8gb'
    build: .
    image: nces-benchmark-v2:latest
    container_name: nces-benchmark-v2-linux
    volumes:
      - ./datasets:/app/datasets:ro
      - ./input:/app/input:ro
      - ./output:/app/output:rw
    # DICE + NCES are CPU-bound; cap threads to keep runs reproducible.
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
